groups:
- name: alert.rules
  rules:
  - alert: InstanceDown
    expr: up == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      description: '{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 30 seconds. '
      summary: Instance {{ $labels.instance }} down

  - alert: HightCPUUsage
    expr: node_cpu_seconds_total{mode="idle"} < 20
    for: 5m
    labels:
      severity: critical
    annotations:
      description: 'CPU usage exceed 80% on the {{ $labels.instance }} at last 5 min'
      summary: CPU hight usage on the {{ $labels.instance }}

  - alert: LowMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.2
    for: 10m
    labels:
      severity: warning
    annotations:
      description: 'Available < 20% memory on the {{ $labels.instance }} at last 10 min'
      summary: Unavailable RAM on the {{ $labels.instance }}